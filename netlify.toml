[build]
  functions = "af-server/netlify/functions" 
  command = "npm install && npm run build"
  publish = "af-client/build"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"
